name: Daily Digest Generator

# 出刊目标（北京时间）：晨报 09:30 前可见，晚报 22:00 前可见。
# 脚本内部用「到点 + 缺口自愈」决定该出哪期（晨报 READY=09:00 / 晚报 READY=21:30），
# 每次运行先查这两期是否已存在：已存在就秒退（不抓新闻、不调大模型、不部署），
# 因此「多触发几次」等于「多次检查 + 缺了才补」，不会重复出刊、也不产生额外费用。
#
# 真正的难点不是脚本逻辑，而是「能让它准点跑起来」——见下方 schedule 的实测说明。
# UTC 说明：北京时间 = UTC+8。
#
# 触发方式：
#   1) schedule       —— 定时触发（低频多点，见下）
#   2) workflow_dispatch —— 手动补跑 / 强制重做 / 外部定时器调用
#   3) push(main)     —— 前端/脚本改动后自动部署 Pages（排除机器人自动提交的 site/data，避免循环）
#      push 时同样会跑一次生成脚本（幂等），所以 push 既部署前端也顺手补缺失的期次。
on:
  schedule:
    # 触发点设计依据（实测数据，北京时间）：
    #   10-26: 11:48 11:57
    #   10-27: 02:57 03:11 04:16 12:10 12:19
    #   10-28: 02:28 02:38 03:47 12:39 12:49
    #   10-29: 02:34 02:47 04:02（此后改成每30分钟轮询，结果7.5小时零触发）
    # 结论：① 每天只布 5 个点左右能稳定触发；② 实际触发比设定晚 4~5 小时。
    # 改成「每 30 分钟」这种高频 cron 会被平台大量丢弃，反而一次都不跑。
    # 因此这里改为「低频 + 按延迟规律双向布点」，每个目标时刻都至少有两个落点：
    #   若平台准时  → UTC 01:05/01:20（北京 09:05/09:20）、13:35（北京 21:35）自己命中窗口
    #   若延迟 3~5h → UTC 20:25~22:25 会漂到北京 09:25 附近；UTC 08:35~10:35 会漂到 21:35 附近
    # 脚本本身幂等：不在窗口内或该期已存在就直接秒退，多触发的点不花钱。
    # 注：这只是「尽力而为」，GitHub 平台若继续丢事件则无法保证；要硬保证需外部定时器。
    - cron: "25 20,21,22 * * *"   # 晨报延迟落点：北京 04:25/05:25/06:25，延后 3~5h 正好落在 09:25 附近
    - cron: "35 8,9,10,13 * * *"  # 晚报延迟落点：北京 16:35/17:35/18:35 延后 3~5h 落在 21:35；13:35 是准时命中点
    - cron: "5 9 * * *"           # 晚报补漏点：北京 17:05，覆盖「延迟 4.4~4.6h」这个夹缝（16:35 太早空跑、17:35 又偏晚）
    - cron: "5,20 10 * * *"       # 晚报补漏点：北京 18:05/18:20，覆盖「延迟 3.2~3.8h」这个夹缝
    - cron: "5,20 1 * * *"        # 晨报准时双保险：北京 09:05 生成，09:20 再查一次（若 09:05 那次失败可自愈）
  workflow_dispatch:        # 支持手动触发
    inputs:
      mode:
        description: "运行模式：normal=正常；topup=强制补齐昨天+今天；pushtest=只测微信推送（不生成、不调模型）"
        required: false
        default: normal
        type: choice
        options:
          - normal
          - topup
          - pushtest
      force:
        description: "是否强制重做（yes=忽略“已生成则跳过”，重写当期；常规使用选 no）"
        required: false
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"
  push:
    branches: [main]
    paths-ignore:
      - "site/data/**"       # 机器人自动提交的数据，不重复部署
      - "**.md"
      - "_local-archive/**"

permissions:
  contents: write
  pages: write
  id-token: write

# 按事件分组：避免「前端部署」与「定时出刊部署」互相取消。
# cancel-in-progress 设为 false：延迟可能把多个触发点挤到一起，若取消进行中的运行，
# 正在生成的那一期会被掐断（模型费已花、数据却丢了）。排队串行更安全。
concurrency:
  group: "pages-${{ github.event_name }}"
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Push test (仅 mode=pushtest)
        if: github.event.inputs.mode == 'pushtest'
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          if [ -z "$PUSHPLUS_TOKEN" ]; then echo "::error::PUSHPLUS_TOKEN 未配置"; exit 1; fi
          code=$(curl -s -o /tmp/r.txt -w "%{http_code}" -X POST https://www.pushplus.plus/send \
            -H 'Content-Type: application/json' \
            -d "{\"token\":\"$PUSHPLUS_TOKEN\",\"title\":\"每日前沿简报 · 推送测试\",\"content\":\"收到这条说明推送链路已打通。\n\n以后每天早报、晚报生成完会自动推到你微信。\n\n如果没有内容可读，点这里看网站：https://yihong-ally.github.io/daily-digest/\",\"template\":\"txt\"}")
          echo "HTTP $code"; cat /tmp/r.txt; echo
          if grep -q '"code":200' /tmp/r.txt; then echo "::notice::推送成功"; else echo "::error::推送失败，见上方返回内容"; exit 1; fi

      - name: Run generator
        if: github.event.inputs.mode != 'pushtest'
        env:
          LLM_BASE: "https://api.deepseek.com/v1"
          LLM_KEY: ${{ secrets.LLM_KEY }}
          LLM_MODEL: "deepseek-chat"
          LIMIT: "90"
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          MODE: ${{ github.event.inputs.mode || 'normal' }}
          FORCE: ${{ github.event.inputs.force == 'yes' && '1' || '' }}
        run: node scripts/generate.js

      - name: Commit generated data
        id: commit
        run: |
          git config user.name "daily-digest-bot"
          git config user.email "daily-digest-bot@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "no data changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: auto update digest $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Pages artifact
        if: always() && (github.event_name == 'push' || steps.commit.outputs.changed == 'true')
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: generate
    if: always() && needs.generate.result == 'success' && (github.event_name == 'push' || needs.generate.outputs.changed == 'true')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
