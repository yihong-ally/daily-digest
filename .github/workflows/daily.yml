name: Daily Digest Generator

# 出刊目标（北京时间）：晨报 09:30 前可见，晚报 22:00 前可见。
# GitHub 的 schedule 触发可能比设定晚数小时（实测 4~5 小时），稀疏定时（每天几个点）一延迟就错过窗口。
# 因此改为「每 30 分钟轮询 + 脚本到点出刊」：
#   - 脚本内部判断当前该出哪期（晨报 READY=09:00 / 晚报 READY=21:30），到点后的第一次轮询即生成；
#   - 未到点或已生成则快速跳过（不抓新闻、不调大模型），且无数据变更时不重新部署 Pages；
#   - 无论 schedule 延迟多久，出刊最多比 READY 晚约半个轮询周期，稳定满足目标。
# UTC 说明：北京时间 = UTC+8，轮询在 UTC 整点/半点触发。
#
# 触发方式：
#   1) schedule       —— 定时轮询出刊（每 30 分钟）
#   2) workflow_dispatch —— 手动补跑 / 强制重做
#   3) push(main)     —— 前端/脚本改动后自动部署 Pages（排除机器人自动提交的 site/data，避免无意义部署）
#      push 触发时只做「上传站点 + 部署」，不跑生成脚本、不调大模型。
on:
  schedule:
    - cron: "0,30 * * * *"  # 每 30 分钟轮询一次（脚本内部判断该出哪期）
  workflow_dispatch:        # 支持手动触发
    inputs:
      mode:
        description: "运行模式：normal=正常（延迟感知+缺口自愈）；topup=强制补齐昨天+今天"
        required: false
        default: normal
        type: choice
        options:
          - normal
          - topup
      force:
        description: "是否强制重做（yes=忽略“已生成则跳过”，重写当期；常规使用选 no）"
        required: false
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"
  push:
    branches: [main]
    paths-ignore:
      - "site/data/**"       # 机器人自动提交的数据，不重复部署
      - "**.md"
      - "_local-archive/**"

permissions:
  contents: write
  pages: write
  id-token: write

# 按事件分组：避免「前端部署」与「定时出刊部署」互相取消
concurrency:
  group: "pages-${{ github.event_name }}"
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        if: github.event_name != 'push'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run generator
        if: github.event_name != 'push'
        env:
          LLM_BASE: "https://api.deepseek.com/v1"
          LLM_KEY: ${{ secrets.LLM_KEY }}
          LLM_MODEL: "deepseek-chat"
          LIMIT: "90"
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          MODE: ${{ github.event.inputs.mode || 'normal' }}
          FORCE: ${{ github.event.inputs.force == 'yes' && '1' || '' }}
        run: node scripts/generate.js

      - name: Commit generated data
        id: commit
        if: github.event_name != 'push'
        run: |
          git config user.name "daily-digest-bot"
          git config user.email "daily-digest-bot@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "no data changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: auto update digest $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Pages artifact
        if: always() && (github.event_name == 'push' || steps.commit.outputs.changed == 'true')
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: generate
    if: always() && needs.generate.result == 'success' && (github.event_name == 'push' || needs.generate.outputs.changed == 'true')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
