name: Daily Digest Generator

# 每天北京时间 08:00 / 18:00 自动生成简报；另加 08:05 / 18:05 补跑 + 22:00 兜底补全，防止 schedule 漏触发
# GitHub Actions 使用 UTC 时区：08:00=00:00 UTC，08:05=00:05 UTC，18:00=10:00 UTC，18:05=10:05 UTC，22:00=14:00 UTC
#
# 关于「定时延迟」：GitHub 的 schedule 实际触发可能比设定晚数小时。脚本已改为「延迟感知 + 缺口自愈」——
#   每跑一次先规划该补哪几期（当天到点的时段优先，其次补昨天的缺口），因此无论延迟多久都不会写错版次。
#   手动触发时可选 mode=topup，强制扫描「昨天 + 今天」四个时段，缺哪期补哪期。
on:
  schedule:
    - cron: "0 0 * * *"   # 北京时间 08:00（晨报主触发）
    - cron: "5 0 * * *"   # 北京时间 08:05（晨报补跑：若已生成则自动跳过）
    - cron: "0 10 * * *"  # 北京时间 18:00（晚报主触发）
    - cron: "5 10 * * *"  # 北京时间 18:05（晚报补跑：若已生成则自动跳过）
    - cron: "0 14 * * *"  # 北京时间 22:00（兜底：扫描昨天+今天，缺哪期补哪期）
  workflow_dispatch:      # 支持手动触发
    inputs:
      mode:
        description: "运行模式：normal=正常（延迟感知+缺口自愈）；topup=强制补齐昨天+今天"
        required: false
        default: normal
        type: choice
        options:
          - normal
          - topup
      force:
        description: "是否强制重做（yes=忽略“已生成则跳过”，重写当期；常规使用选 no）"
        required: false
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run generator
        env:
          LLM_BASE: "https://api.deepseek.com/v1"
          LLM_KEY: ${{ secrets.LLM_KEY }}
          LLM_MODEL: "deepseek-chat"
          LIMIT: "60"
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          MODE: ${{ github.event.inputs.mode || 'normal' }}
          FORCE: ${{ github.event.inputs.force == 'yes' && '1' || '' }}
        run: node scripts/generate.js

      - name: Commit generated data
        run: |
          git config user.name "daily-digest-bot"
          git config user.email "daily-digest-bot@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "chore: auto update digest $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
