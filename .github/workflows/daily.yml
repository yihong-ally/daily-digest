name: Daily Digest Generator

# 出刊目标（北京时间）：晨报 09:30 前可见，晚报 22:00 前可见。
# GitHub 的 schedule 触发可能比设定晚数小时（实测 4~5 小时），稀疏定时（每天几个点）一延迟就错过窗口。
# 因此改为「每 30 分钟轮询 + 脚本到点出刊」：
#   - 脚本内部判断当前该出哪期（晨报 READY=09:00 / 晚报 READY=21:30），到点后的第一次轮询即生成；
#   - 未到点或已生成则快速跳过（不抓新闻、不调大模型），且无数据变更时不重新部署 Pages；
#   - 无论 schedule 延迟多久，出刊最多比 READY 晚约半个轮询周期，稳定满足目标。
# UTC 说明：北京时间 = UTC+8，轮询在 UTC 整点/半点触发。
#
# 触发方式：
#   1) schedule       —— 定时轮询出刊（每 30 分钟；注意：GitHub 的 schedule 实际很不可靠，
#                        实测出现过「设定 30 分钟一次、连续 24 小时一次都没触发」的情况）
#   2) workflow_dispatch —— 手动补跑 / 强制重做 / 外部定时器调用
#   3) push(main)     —— 前端/脚本改动后自动部署 Pages（排除机器人自动提交的 site/data，避免循环）
#      push 时同样会跑一次生成脚本：脚本是幂等的（该出的期都已存在就秒退，不调大模型），
#      因此 push 既是「部署前端」也是「顺手补上缺失的期次」，不会产生额外模型费用。
on:
  schedule:
    # 触发点设计依据（实测数据，北京时间）：
    #   10-26: 11:48 11:57
    #   10-27: 02:57 03:11 04:16 12:10 12:19
    #   10-28: 02:28 02:38 03:47 12:39 12:49
    #   10-29: 02:34 02:47 04:02（此后改成每30分钟轮询，结果7.5小时零触发）
    # 结论：① 每天只布 5 个点左右能稳定触发；② 实际触发比设定晚 4~5 小时。
    # 改成「每 30 分钟」这种高频 cron 会被平台大量丢弃，反而一次都不跑。
    # 因此这里改为「低频 + 按延迟规律双向布点」：
    #   准时情况  → UTC 01:05 / 13:35 这两个点自己命中窗口
    #   延迟 3~6h → UTC 19:35~21:35（晨）/ 08:05~10:05（晚）会向后漂进窗口
    # 脚本本身幂等：不在窗口内或该期已存在就直接秒退，多触发的点不花钱。
    # 注：这只是「尽力而为」，GitHub 平台若继续丢事件则无法保证；要硬保证需外部定时器。
    - cron: "25 20,21,22 * * *"   # 晨报延迟落点：北京 04:25/05:25/06:25，延后 3~5h 正好落在 09:25 附近
    - cron: "35 8,9,10,13 * * *"  # 晚报延迟落点：北京 16:35/17:35/18:35 延后 3~5h 落在 21:35；13:35 是准时命中点
    - cron: "5 1 * * *"           # 晨报准时命中点：北京时间 09:05
  workflow_dispatch:        # 支持手动触发
    inputs:
      mode:
        description: "运行模式：normal=正常（延迟感知+缺口自愈）；topup=强制补齐昨天+今天"
        required: false
        default: normal
        type: choice
        options:
          - normal
          - topup
      force:
        description: "是否强制重做（yes=忽略“已生成则跳过”，重写当期；常规使用选 no）"
        required: false
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"
  push:
    branches: [main]
    paths-ignore:
      - "site/data/**"       # 机器人自动提交的数据，不重复部署
      - "**.md"
      - "_local-archive/**"

permissions:
  contents: write
  pages: write
  id-token: write

# 按事件分组：避免「前端部署」与「定时出刊部署」互相取消
concurrency:
  group: "pages-${{ github.event_name }}"
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run generator
        env:
          LLM_BASE: "https://api.deepseek.com/v1"
          LLM_KEY: ${{ secrets.LLM_KEY }}
          LLM_MODEL: "deepseek-chat"
          LIMIT: "90"
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          MODE: ${{ github.event.inputs.mode || 'normal' }}
          FORCE: ${{ github.event.inputs.force == 'yes' && '1' || '' }}
        run: node scripts/generate.js

      - name: Commit generated data
        id: commit
        run: |
          git config user.name "daily-digest-bot"
          git config user.email "daily-digest-bot@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "no data changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: auto update digest $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Pages artifact
        if: always() && (github.event_name == 'push' || steps.commit.outputs.changed == 'true')
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: generate
    if: always() && needs.generate.result == 'success' && (github.event_name == 'push' || needs.generate.outputs.changed == 'true')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
